services:
  - type: web
    name: ai-9kpu
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NUTRIAI_SECRET_KEY
        generateValue: true
      - key: NUTRIAI_DATABASE_URL
        sync: false
      - key: NUTRIAI_CORS_ORIGINS
        sync: false
